<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ABI Pets – Marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* Same as before, keep all styles */
        :root {
            --primary: #0b2b3c;
            --primary-light: #1a3f52;
            --secondary: #0ea5e9;
            --secondary-hover: #0284c7;
            --accent: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --surface: #ffffff;
            --surface-alt: #f1f5f9;
            --text: #0f172a;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --header-height: 64px;
            --bottom-nav-height: 64px;
        }
        [data-theme="dark"] {
            --primary: #0b1120;
            --primary-light: #1a2332;
            --surface: #13202e;
            --surface-alt: #0f1a26;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-light: #64748b;
            --border: #2d3a4a;
            --shadow: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.6);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { font-size: 15px; scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: var(--surface-alt); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; padding-top: var(--header-height); padding-bottom: var(--bottom-nav-height); overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
        input, select, textarea { font-family: inherit; font-size: 0.95rem; outline: none; border: none; background: none; color: inherit; }

        /* Header */
        .header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; z-index: 999; transition: background 0.3s, border 0.3s; }
        .header .logo { font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .header .logo i { color: var(--secondary); font-size: 1.4rem; }
        .header .logo span { background: linear-gradient(135deg, var(--secondary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .header-actions .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-secondary); transition: var(--transition); position: relative; font-size: 1rem; }
        .header-actions .icon-btn:hover { border-color: var(--secondary); color: var(--text); }
        .header-actions .icon-btn .dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: var(--danger); border-radius: 50%; border: 2px solid var(--surface); }
        .header-actions .panel-link { padding: 6px 14px; border-radius: 30px; background: var(--secondary); color: white; font-size: 0.75rem; font-weight: 600; transition: var(--transition); display: flex; align-items: center; gap: 5px; }
        .header-actions .panel-link:hover { background: var(--secondary-hover); transform: translateY(-1px); }
        .auth-indicator { width: 10px; height: 10px; border-radius: 50%; background: var(--success); display: none; }
        .auth-indicator.active { display: block; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-nav-height); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-around; z-index: 999; transition: background 0.3s, border 0.3s; }
        .bottom-nav .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-secondary); font-size: 0.6rem; font-weight: 500; transition: var(--transition); cursor: pointer; position: relative; padding: 4px 12px; }
        .bottom-nav .nav-item i { font-size: 1.3rem; margin-bottom: 2px; }
        .bottom-nav .nav-item.active { color: var(--secondary); }
        .bottom-nav .nav-item .badge { position: absolute; top: -2px; right: 2px; background: var(--danger); color: white; font-size: 0.55rem; font-weight: 700; padding: 1px 6px; border-radius: 30px; min-width: 18px; text-align: center; display: none; }
        .bottom-nav .nav-item .badge.active { display: block; }

        /* Pages */
        .page { display: none; padding: 16px; animation: fadeUp 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* Slider */
        .slider-container { position: relative; border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; height: 180px; background: var(--primary-light); }
        .slider-track { display: flex; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); height: 100%; }
        .slider-track .slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 1.5rem; background-size: cover; background-position: center; position: relative; }
        .slider-track .slide .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .slider-track .slide .overlay h2 { font-size: 1.6rem; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .slider-track .slide .overlay p { font-size: 0.9rem; opacity: 0.9; max-width: 280px; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; transition: var(--transition); }
        .slider-btn:hover { background: rgba(0,0,0,0.6); }
        .slider-btn.prev { left: 8px; }
        .slider-btn.next { right: 8px; }
        .slider-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; }
        .slider-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); transition: var(--transition); cursor: pointer; }
        .slider-dots .dot.active { background: white; width: 20px; border-radius: 10px; }

        /* Categories */
        .categories-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 16px; scrollbar-width: none; -ms-overflow-style: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }
        .category-chip { padding: 8px 18px; border-radius: 30px; background: var(--surface); border: 1px solid var(--border); font-weight: 500; font-size: 0.8rem; white-space: nowrap; transition: var(--transition); color: var(--text-secondary); cursor: pointer; box-shadow: var(--shadow); }
        .category-chip:hover { border-color: var(--secondary); color: var(--text); }
        .category-chip.active { background: var(--secondary); color: white; border-color: var(--secondary); }

        /* Product Grid */
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .section-title .see-all { font-size: 0.75rem; font-weight: 500; color: var(--secondary); cursor: pointer; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; }
        .product-card { background: var(--surface); border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); transition: var(--transition); cursor: pointer; box-shadow: var(--shadow); }
        .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .product-card .img-wrap { height: 140px; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .product-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .product-card .img-wrap .wishlist-btn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.85); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 0.85rem; transition: var(--transition); border: none; }
        .product-card .img-wrap .wishlist-btn.active { color: var(--danger); }
        .product-card .img-wrap .wishlist-btn:hover { transform: scale(1.1); }
        .product-card .body { padding: 12px 14px 14px; }
        .product-card .body .name { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-card .body .meta { font-size: 0.7rem; color: var(--text-secondary); display: flex; gap: 6px; margin-top: 2px; }
        .product-card .body .price { font-weight: 700; font-size: 1.05rem; color: var(--secondary); margin-top: 4px; }
        .product-card .body .add-btn { width: 100%; padding: 7px 0; margin-top: 10px; border-radius: 6px; background: var(--secondary); color: white; font-weight: 600; font-size: 0.8rem; transition: var(--transition); border: none; }
        .product-card .body .add-btn:hover { background: var(--secondary-hover); }

        /* List items (cart/wishlist) */
        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .list-item:last-child { border-bottom: none; }
        .list-item img { width: 60px; height: 60px; border-radius: var(--radius-sm); object-fit: cover; border: 1px solid var(--border); }
        .list-item .info { flex: 1; }
        .list-item .info .name { font-weight: 600; font-size: 0.9rem; }
        .list-item .info .sub { font-size: 0.8rem; color: var(--text-secondary); }
        .list-item .info .price { font-weight: 700; color: var(--secondary); }
        .list-item .actions { display: flex; gap: 8px; align-items: center; }
        .list-item .actions .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; transition: var(--transition); background: var(--surface-alt); }
        .list-item .actions .qty-btn:hover { border-color: var(--secondary); color: var(--secondary); }
        .list-item .actions .qty-num { font-weight: 600; min-width: 24px; text-align: center; }
        .btn-danger-sm { padding: 4px 12px; border-radius: 6px; background: var(--danger); color: white; font-size: 0.7rem; font-weight: 600; transition: var(--transition); }
        .btn-danger-sm:hover { background: var(--danger-hover); }
        .btn-primary-sm { padding: 4px 12px; border-radius: 6px; background: var(--secondary); color: white; font-size: 0.7rem; font-weight: 600; transition: var(--transition); }
        .btn-primary-sm:hover { background: var(--secondary-hover); }
        .cart-total { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; font-weight: 700; font-size: 1.1rem; border-top: 2px solid var(--border); margin-top: 8px; }
        .checkout-btn { width: 100%; padding: 14px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--secondary), var(--accent)); color: white; font-weight: 700; font-size: 1rem; transition: var(--transition); border: none; margin-top: 12px; }
        .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(14,165,233,0.3); }

        /* Empty state */
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-state i { font-size: 3rem; color: var(--text-light); opacity: 0.3; margin-bottom: 12px; }
        .empty-state h4 { font-weight: 600; font-size: 1.1rem; margin-bottom: 4px; }
        .empty-state p { color: var(--text-secondary); font-size: 0.9rem; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(6px); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--surface); border-radius: var(--radius); max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px 24px; border: 1px solid var(--border); box-shadow: var(--shadow-lg); animation: slideUp 0.25s ease; position: relative; }
        @keyframes slideUp { from { transform: translateY(30px) scale(0.96); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        .modal-box .close-modal { position: absolute; top: 14px; right: 18px; font-size: 1.3rem; color: var(--text-secondary); transition: var(--transition); background: none; border: none; }
        .modal-box .close-modal:hover { color: var(--text); transform: rotate(90deg); }
        .modal-box h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
        .modal-box p.sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 16px; }
        .modal-box .form-group { margin-bottom: 14px; }
        .modal-box .form-group label { display: block; font-weight: 600; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
        .modal-box .form-group .input-wrap { display: flex; align-items: center; background: var(--surface-alt); border: 1.5px solid var(--border); border-radius: var(--radius-sm); transition: var(--transition); padding: 0 12px; }
        .modal-box .form-group .input-wrap:focus-within { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(14,165,233,0.1); }
        .modal-box .form-group .input-wrap i { color: var(--text-light); font-size: 0.9rem; margin-right: 10px; }
        .modal-box .form-group .input-wrap input, .modal-box .form-group .input-wrap select, .modal-box .form-group .input-wrap textarea { width: 100%; padding: 11px 0; background: transparent; border: none; font-size: 0.95rem; color: var(--text); }
        .modal-box .form-group .input-wrap textarea { resize: vertical; min-height: 70px; padding: 8px 0; }
        .modal-box .btn-primary { width: 100%; padding: 13px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--secondary), var(--accent)); color: white; font-weight: 600; font-size: 0.95rem; transition: var(--transition); border: none; margin-top: 6px; }
        .modal-box .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(14,165,233,0.3); }
        .modal-box .btn-primary:disabled { opacity: 0.6; transform: none !important; }
        .modal-box .auth-toggle { text-align: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 0.9rem; color: var(--text-secondary); }
        .modal-box .auth-toggle a { color: var(--secondary); font-weight: 600; cursor: pointer; }
        .modal-box .auth-msg { padding: 10px 14px; border-radius: var(--radius-sm); margin-top: 12px; display: none; font-size: 0.85rem; font-weight: 500; }
        .modal-box .auth-msg.error { display: block; background: rgba(239,68,68,0.08); color: var(--danger); border: 1px solid rgba(239,68,68,0.12); }
        .modal-box .auth-msg.success { display: block; background: rgba(16,185,129,0.08); color: var(--success); border: 1px solid rgba(16,185,129,0.12); }

        /* Toast */
        .toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 99999; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 380px; pointer-events: none; }
        .toast { padding: 14px 18px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; pointer-events: auto; animation: slideUp 0.3s ease; transition: var(--transition); }
        .toast.exit { transform: translateY(20px); opacity: 0; }
        .toast .toast-icon { font-size: 1.2rem; flex-shrink: 0; }
        .toast .toast-icon.success { color: var(--success); }
        .toast .toast-icon.error { color: var(--danger); }
        .toast .toast-icon.warning { color: var(--warning); }
        .toast .toast-icon.info { color: var(--secondary); }
        .toast .toast-body { flex: 1; }
        .toast .toast-body .title { font-weight: 600; font-size: 0.9rem; }
        .toast .toast-body .msg { color: var(--text-secondary); font-size: 0.8rem; }
        .toast .toast-close { background: none; border: none; color: var(--text-light); font-size: 1rem; cursor: pointer; padding: 4px; }
        .toast .toast-close:hover { color: var(--text); }

        /* Loader */
        .loader { position: fixed; inset: 0; background: var(--surface); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity 0.5s; }
        .loader.hide { opacity: 0; pointer-events: none; }
        .loader .spinner { width: 44px; height: 44px; border: 4px solid var(--border); border-top-color: var(--secondary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader p { font-size: 0.9rem; color: var(--text-secondary); max-width: 280px; text-align: center; }

        /* Status badges */
        .status-badge { padding: 3px 12px; border-radius: 30px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .status-badge.pending { background: rgba(245,158,11,0.12); color: var(--warning); }
        .status-badge.shipped { background: rgba(14,165,233,0.12); color: var(--secondary); }
        .status-badge.delivered { background: rgba(16,185,129,0.12); color: var(--success); }
        .status-badge.cancelled { background: rgba(239,68,68,0.12); color: var(--danger); }

        
        .theme-float { position: fixed; bottom: 80px; right: 16px; width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: var(--text-secondary); z-index: 100; transition: var(--transition); cursor: pointer; }
        .theme-float:hover { transform: scale(1.05); border-color: var(--secondary); color: var(--text); }
        @media (min-width: 768px) { .theme-float { bottom: 24px; right: 24px; } }
        @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); } .slider-container { height: 220px; } .modal-box { padding: 32px 30px; } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); } }
        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .text-secondary { color: var(--text-secondary); }
        .text-sm { font-size: 0.85rem; }
        .font-bold { font-weight: 700; }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 12px; }
        .mt-4 { margin-top: 16px; }
        .mb-2 { margin-bottom: 8px; }
        .mb-3 { margin-bottom: 12px; }
        .gap-2 { gap: 8px; }
        .flex { display: flex; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .w-full { width: 100%; }
    </style>
</head>
<body>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>कृपया केही बेर पर्खनुहोस्, तपाईंको वेबसाइट लोड हुँदैछ। 🙏💐</p>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="logo"><i class="fas fa-fish"></i><span>ABI Pets</span></div>
        <div class="header-actions">
            <button class="icon-btn" id="searchBtn"><i class="fas fa-search"></i></button>
            <div class="auth-indicator" id="authIndicator"></div>
            <a href="seller.html" class="panel-link" target="_blank"><i class="fas fa-store"></i> Seller</a>
        </div>
    </header>

    <!-- Pages -->
    <section class="page active" id="page-home">
        <div class="slider-container" id="sliderContainer">
            <div class="slider-track" id="sliderTrack"></div>
            <button class="slider-btn prev" id="sliderPrev"><i class="fas fa-chevron-left"></i></button>
            <button class="slider-btn next" id="sliderNext"><i class="fas fa-chevron-right"></i></button>
            <div class="slider-dots" id="sliderDots"></div>
        </div>
        <div class="categories-scroll" id="categoriesContainer"></div>
        <div class="section-title"><span>🐾 Featured Pets</span><span class="see-all" id="seeAllBtn">See All</span></div>
        <div class="product-grid" id="productGrid"></div>
    </section>

    <section class="page" id="page-search">
        <div style="margin-bottom:16px;">
            <input type="text" id="searchInput" placeholder="Search for pets, breeds..." style="width:100%;padding:14px 18px;border-radius:var(--radius-sm);border:2px solid var(--border);background:var(--surface);font-size:1rem;color:var(--text);transition:var(--transition);" />
        </div>
        <div class="product-grid" id="searchResults"></div>
    </section>

    <section class="page" id="page-wishlist">
        <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:12px;">❤️ My Wishlist</h2>
        <div id="wishlistContainer"></div>
    </section>

    <section class="page" id="page-cart">
        <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:12px;">🛒 Shopping Cart</h2>
        <div id="cartContainer"></div>
    </section>

    <section class="page" id="page-orders">
        <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:12px;">📦 My Orders</h2>
        <div id="ordersContainer"></div>
    </section>

    <section class="page" id="page-profile">
        <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:12px;">👤 Profile</h2>
        <div class="card" style="background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);padding:20px;">
            <p><strong>Email:</strong> <span id="profileEmail">—</span></p>
            <p class="mt-2"><strong>Member since:</strong> <span id="profileJoined">—</span></p>
            <button class="btn-primary-sm mt-3" id="profileLogout" style="padding:10px 20px;background:var(--danger);color:white;border-radius:6px;font-weight:600;">Logout</button>
        </div>
    </section>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-page="home"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="nav-item" data-page="search"><i class="fas fa-search"></i><span>Search</span></div>
        <div class="nav-item" data-page="wishlist"><i class="fas fa-heart"></i><span>Wishlist</span><span class="badge" id="wishlistBadge">0</span></div>
        <div class="nav-item" data-page="cart"><i class="fas fa-shopping-cart"></i><span>Cart</span><span class="badge" id="cartBadge">0</span></div>
        <div class="nav-item" data-page="orders"><i class="fas fa-box"></i><span>Orders</span></div>
    </nav>

    <!-- Theme toggle -->
    <button class="theme-float" id="themeFloat"><i class="fas fa-moon"></i></button>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <button class="close-modal" id="modalClose"><i class="fas fa-times"></i></button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Firebase + App -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import {
            getDatabase,
            ref,
            get,
            set,
            push,
            onValue,
            remove,
            update
        } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAgrXYL1M-cO8LYTmJeEtfwhkp-ghXfNWY",
            authDomain: "abi-fish-pets.firebaseapp.com",
            databaseURL: "https://abi-fish-pets-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "abi-fish-pets",
            storageBucket: "abi-fish-pets.firebasestorage.app",
            messagingSenderId: "644115504257",
            appId: "1:644115504257:web:278b713d235aa8938a0180",
            measurementId: "G-2T3T8RTJKE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ---- State ----
        let currentUser = null;
        let allProducts = [];
        let cartData = {};
        let wishlistData = {};
        let ordersData = [];
        let currentSlide = 0;
        let slideInterval = null;
        let userCartRef = null;
        let userWishlistRef = null;

        // ---- DOM refs ----
        const loader = document.getElementById('loader');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBody = document.getElementById('modalBody');
        const modalClose = document.getElementById('modalClose');
        const toastContainer = document.getElementById('toastContainer');
        const themeFloat = document.getElementById('themeFloat');

        // ---- Helpers ----
        function showToast(title, msg, type = 'success') {
            const icons = { success: 'fas fa-check-circle', error: 'fas fa-exclamation-circle', warning: 'fas fa-exclamation-triangle', info: 'fas fa-info-circle' };
            const el = document.createElement('div');
            el.className = 'toast';
            el.innerHTML = `
                <div class="toast-icon ${type}"><i class="${icons[type] || icons.info}"></i></div>
                <div class="toast-body"><div class="title">${title}</div><div class="msg">${msg}</div></div>
                <button class="toast-close"><i class="fas fa-times"></i></button>
            `;
            toastContainer.appendChild(el);
            el.querySelector('.toast-close').addEventListener('click', () => {
                el.classList.add('exit');
                setTimeout(() => el.remove(), 300);
            });
            setTimeout(() => {
                if (el.parentNode) {
                    el.classList.add('exit');
                    setTimeout(() => el.remove(), 300);
                }
            }, 3500);
        }

        function openModal(html) {
            modalBody.innerHTML = html;
            modalOverlay.classList.add('open');
        }

        function closeModal() { modalOverlay.classList.remove('open'); }
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

        // ---- Theme ----
        let theme = localStorage.getItem('marketTheme') || 'light';
        function setTheme(t) {
            theme = t;
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('marketTheme', t);
            themeFloat.querySelector('i').className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
        }
        themeFloat.addEventListener('click', () => setTheme(theme === 'dark' ? 'light' : 'dark'));
        setTheme(theme);

        // ---- Navigation ----
        const navItems = document.querySelectorAll('.bottom-nav .nav-item');
        const pages = {
            home: document.getElementById('page-home'),
            search: document.getElementById('page-search'),
            wishlist: document.getElementById('page-wishlist'),
            cart: document.getElementById('page-cart'),
            orders: document.getElementById('page-orders'),
            profile: document.getElementById('page-profile')
        };
function navigateTo(page) {
            Object.keys(pages).forEach(key => pages[key].classList.toggle('active', key === page));
            navItems.forEach(item => item.classList.toggle('active', item.dataset.page === page));
            if (page === 'search') document.getElementById('searchInput').focus();
            if (page === 'cart') renderCart();
            if (page === 'wishlist') renderWishlist();
            if (page === 'orders') renderOrders();
            if (page === 'profile') renderProfile();
        }

        navItems.forEach(item => {
            item.addEventListener('click', () => navigateTo(item.dataset.page));
        });

        document.getElementById('searchBtn').addEventListener('click', () => navigateTo('search'));

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            const results = q ? allProducts.filter(p =>
                p.name.toLowerCase().includes(q) ||
                (p.type && p.type.toLowerCase().includes(q)) ||
                (p.breed && p.breed.toLowerCase().includes(q)) ||
                (p.description && p.description.toLowerCase().includes(q))
            ) : [];
            renderSearchResults(results);
        });

        document.getElementById('seeAllBtn').addEventListener('click', () => {
            navigateTo('search');
            document.getElementById('searchInput').focus();
        });

        // ---- Slider ----
        function renderSlider(images) {
            const track = document.getElementById('sliderTrack');
            const dots = document.getElementById('sliderDots');
            if (!images || images.length === 0) {
                track.innerHTML = `<div class="slide" style="background:linear-gradient(135deg,var(--secondary),var(--accent));"><div class="overlay"><h2>🐠 Welcome to ABI Pets</h2><p>Find your perfect pet companion</p></div></div>`;
                dots.innerHTML = '';
                return;
            }
            track.innerHTML = images.map((img, i) => `
                <div class="slide" style="background-image:url('${img.downloadURL || img}');">
                    <div class="overlay"><h2>${img.title || 'Special Offer'}</h2><p>${img.subtitle || 'Find your perfect pet today'}</p></div>
                </div>
            `).join('');
            dots.innerHTML = images.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>`).join('');
            currentSlide = 0;
            goToSlide(0);
            startSlider();
        }

        function goToSlide(index) {
            const track = document.getElementById('sliderTrack');
            const slides = track.querySelectorAll('.slide');
            if (!slides.length) return;
            if (index < 0) index = slides.length - 1;
            if (index >= slides.length) index = 0;
            currentSlide = index;
            track.style.transform = `translateX(-${index * 100}%)`;
            document.querySelectorAll('#sliderDots .dot').forEach((d, i) => d.classList.toggle('active', i === index));
        }

        function startSlider() {
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(() => goToSlide(currentSlide + 1), 5000);
        }

        document.getElementById('sliderPrev').addEventListener('click', () => { goToSlide(currentSlide - 1);
            startSlider(); });
        document.getElementById('sliderNext').addEventListener('click', () => { goToSlide(currentSlide + 1);
            startSlider(); });
        document.getElementById('sliderDots').addEventListener('click', (e) => {
            const dot = e.target.closest('.dot');
            if (dot) { goToSlide(parseInt(dot.dataset.index));
                startSlider(); }
        });

        // ---- Render functions ----
        function renderCategories(products) {
            const container = document.getElementById('categoriesContainer');
            const cats = ['All', ...new Set(products.map(p => p.type || 'Pet'))];
            container.innerHTML = cats.map(cat =>
                `<div class="category-chip ${cat === 'All' ? 'active' : ''}" data-cat="${cat}">${cat}</div>`
            ).join('');
            container.addEventListener('click', (e) => {
                const chip = e.target.closest('.category-chip');
                if (!chip) return;
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                const cat = chip.dataset.cat;
                renderProducts(cat === 'All' ? allProducts : allProducts.filter(p => p.type === cat));
            });
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            if (!products || products.length === 0) {
                grid.innerHTML =
                    `<div style="grid-column:1/-1;text-align:center;padding:40px 0;"><i class="fas fa-paw" style="font-size:2rem;color:var(--text-light);opacity:0.3;"></i><p class="text-secondary mt-2">No pets found</p></div>`;
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="product-card" data-id="${p.id}">
                    <div class="img-wrap">
                        <img src="${p.imageUrl || 'https://via.placeholder.com/200?text=Pet'}" alt="${p.name}" loading="lazy" />
                        <button class="wishlist-btn ${wishlistData[p.id] ? 'active' : ''}" data-id="${p.id}"><i class="fas fa-heart"></i></button>
                    </div>
                    <div class="body">
                        <div class="name">${p.name}</div>
                        <div class="meta"><span>${p.type || 'Pet'}</span> • <span>${p.breed || 'Mixed'}</span></div>
                        <div class="price">NPR ${parseFloat(p.price || 0).toFixed(2)}</div>
                        <button class="add-btn" data-id="${p.id}">Add to Cart</button>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.add-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation();
                    handleAddToCart(btn.dataset.id); });
            });
            grid.querySelectorAll('.wishlist-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation();
                    handleToggleWishlist(btn.dataset.id); });
            });
            grid.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = card.dataset.id;
                    const p = allProducts.find(x => x.id === id);
                    if (p) openProductDetail(p);
                });
            });
        }

        function renderSearchResults(results) {
            const grid = document.getElementById('searchResults');
            if (!results || results.length === 0) {
                grid.innerHTML =
                    `<div style="grid-column:1/-1;text-align:center;padding:40px 0;"><i class="fas fa-search" style="font-size:2rem;color:var(--text-light);opacity:0.3;"></i><p class="text-secondary mt-2">No results found</p></div>`;
                return;
            }
            grid.innerHTML = results.map(p => `
                <div class="product-card" data-id="${p.id}">
                    <div class="img-wrap">
                        <img src="${p.imageUrl || 'https://via.placeholder.com/200?text=Pet'}" alt="${p.name}" loading="lazy" />
                        <button class="wishlist-btn ${wishlistData[p.id] ? 'active' : ''}" data-id="${p.id}"><i class="fas fa-heart"></i></button>
                    </div>
                    <div class="body">
                        <div class="name">${p.name}</div>
                        <div class="meta"><span>${p.type || 'Pet'}</span> • <span>${p.breed || 'Mixed'}</span></div>
                        <div class="price">NPR ${parseFloat(p.price || 0).toFixed(2)}</div>
                        <button class="add-btn" data-id="${p.id}">Add to Cart</button>
                    </div>
                </div>
            `).join('');
            grid.querySelectorAll('.add-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation();
                    handleAddToCart(btn.dataset.id); });
            });
            grid.querySelectorAll('.wishlist-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { e.stopPropagation();
                    handleToggleWishlist(btn.dataset.id); });
            });
        }

        function renderCart() {
            const container = document.getElementById('cartContainer');
            const badge = document.getElementById('cartBadge');
            const items = Object.entries(cartData);
            const totalItems = items.reduce((s, [_, v]) => s + v.quantity, 0);
            badge.textContent = totalItems;
            badge.classList.toggle('active', totalItems > 0);

            if (items.length === 0) {
                container.innerHTML =
                    `<div class="empty-state"><i class="fas fa-shopping-cart"></i><h4>Cart is empty</h4><p>Start adding some pets to your cart!</p></div>`;
                return;
            }
            let totalPrice = 0;
            let html = items.map(([id, item]) => {
                const p = allProducts.find(x => x.id === id);
                if (!p) return '';
                const subtotal = p.price * item.quantity;
                totalPrice += subtotal;
                return `
                    <div class="list-item" data-id="${id}">
                        <img src="${p.imageUrl || 'https://via.placeholder.com/60?text=Pet'}" alt="${p.name}" />
                        <div class="info">
                            <div class="name">${p.name}</div>
                            <div class="sub">${p.type || 'Pet'}</div>
                            <div class="price">NPR ${subtotal.toFixed(2)}</div>
                        </div>
                        <div class="actions">
                            <button class="qty-btn qty-dec" data-id="${id}">−</button>
                            <span class="qty-num">${item.quantity}</span>
                            <button class="qty-btn qty-inc" data-id="${id}">+</button>
                            <button class="btn-danger-sm remove-cart" data-id="${id}">×</button>
                        </div>
                    </div>
                `;
            }).join('');

            html += `
                <div class="cart-total"><span>Total</span><span>NPR ${totalPrice.toFixed(2)}</span></div>
                <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
            `;

            container.innerHTML = html;

            container.querySelectorAll('.qty-inc').forEach(btn => {
                btn.addEventListener('click', () => updateCartQty(btn.dataset.id, 1));
            });
            container.querySelectorAll('.qty-dec').forEach(btn => {
                btn.addEventListener('click', () => updateCartQty(btn.dataset.id, -1));
            });
            container.querySelectorAll('.remove-cart').forEach(btn => {
                btn.addEventListener('click', () => removeFromCart(btn.dataset.id));
            });
            document.getElementById('checkoutBtn')?.addEventListener('click', openCheckout);
        }

        function renderWishlist() {
            const container = document.getElementById('wishlistContainer');
            const badge = document.getElementById('wishlistBadge');
            const items = Object.keys(wishlistData);
            badge.textContent = items.length;
            badge.classList.toggle('active', items.length > 0);

            if (items.length === 0) {
                container.innerHTML =
                    `<div class="empty-state"><i class="fas fa-heart"></i><h4>Wishlist is empty</h4><p>Save your favorite pets here.</p></div>`;
                return;
            }

            container.innerHTML = items.map(id => {
                const p = allProducts.find(x => x.id === id);
                if (!p) return '';
                return `
                    <div class="list-item" data-id="${id}">
                        <img src="${p.imageUrl || 'https://via.placeholder.com/60?text=Pet'}" alt="${p.name}" />
                        <div class="info">
                            <div class="name">${p.name}</div>
                            <div class="sub">${p.type || 'Pet'} • ${p.breed || 'Mixed'}</div>
                            <div class="price">NPR ${parseFloat(p.price || 0).toFixed(2)}</div>
                        </div>
                        <div class="actions">
                            <button class="btn-primary-sm move-cart" data-id="${id}">Add to Cart</button>
                            <button class="btn-danger-sm remove-wishlist" data-id="${id}">×</button>
                        </div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('.move-cart').forEach(btn => {
                btn.addEventListener('click', async () => {
                    await handleAddToCart(btn.dataset.id);
                    await handleToggleWishlist(btn.dataset.id);
                    renderWishlist();
                });
            });
            container.querySelectorAll('.remove-wishlist').forEach(btn => {
                btn.addEventListener('click', () => handleToggleWishlist(btn.dataset.id));
            });
        }
    function renderOrders() {
            const container = document.getElementById('ordersContainer');
            if (!ordersData || ordersData.length === 0) {
                container.innerHTML =
                    `<div class="empty-state"><i class="fas fa-box"></i><h4>No orders yet</h4><p>Your orders will appear here.</p></div>`;
                return;
            }
            container.innerHTML = ordersData.map(o => `
                <div style="background:var(--surface);border-radius:var(--radius-sm);border:1px solid var(--border);padding:16px;margin-bottom:12px;">
                    <div class="flex-between">
                        <div><strong>Order #${o.id?.slice(-6) || 'N/A'}</strong></div>
                        <span class="status-badge ${o.status || 'pending'}">${o.status || 'pending'}</span>
                    </div>
                    <p class="text-sm text-secondary">${new Date(o.date || Date.now()).toLocaleDateString()}</p>
                    <p class="text-sm mt-2"><strong>Items:</strong> ${(o.items || []).map(i => `${i.name} (x${i.quantity})`).join(', ')}</p>
                    <p class="font-bold mt-2">Total: NPR ${parseFloat(o.totalAmount || 0).toFixed(2)}</p>
                    ${o.shippingAddress ? `<p class="text-sm text-secondary mt-1">📦 ${o.shippingAddress}</p>` : ''}
                </div>
            `).join('');
        }

        function renderProfile() {
            document.getElementById('profileEmail').textContent = currentUser?.email || '—';
            document.getElementById('profileJoined').textContent = '—';
            document.getElementById('profileLogout').addEventListener('click', handleLogout);
        }

        function openProductDetail(p) {
            const inWishlist = !!wishlistData[p.id];
            openModal(`
                <h2>${p.name}</h2>
                <p class="sub">${p.type || 'Pet'} • ${p.breed || 'Mixed'}</p>
                <img src="${p.imageUrl || 'https://via.placeholder.com/400?text=Pet'}" alt="${p.name}" style="width:100%;border-radius:var(--radius-sm);margin:8px 0 12px;border:1px solid var(--border);" />
                <p><strong>Price:</strong> NPR ${parseFloat(p.price || 0).toFixed(2)}</p>
                <p><strong>Age:</strong> ${p.age || 'N/A'} months</p>
                <p><strong>Weight:</strong> ${p.weight || 'N/A'} kg</p>
                <p><strong>Vaccination:</strong> ${p.vaccination || 'Not specified'}</p>
                <p class="mt-2 text-sm text-secondary">${p.description || 'No description available.'}</p>
                <div style="display:flex;gap:10px;margin-top:16px;">
                    <button class="btn-primary-sm" style="flex:1;padding:12px;background:var(--secondary);color:white;border-radius:6px;font-weight:600;" id="detailAddCart">Add to Cart</button>
                    <button class="btn-primary-sm" style="flex:1;padding:12px;background:${inWishlist ? 'var(--danger)' : 'var(--surface)'};color:${inWishlist ? 'white' : 'var(--text)'};border:1px solid var(--border);border-radius:6px;font-weight:600;" id="detailWishlist">${inWishlist ? '❤️ Saved' : '🤍 Save'}</button>
                </div>
            `);
            document.getElementById('detailAddCart').addEventListener('click', () => {
                handleAddToCart(p.id);
                closeModal();
            });
            document.getElementById('detailWishlist').addEventListener('click', () => {
                handleToggleWishlist(p.id);
                closeModal();
                openProductDetail(p);
            });
        }

        // ---- Cart actions ----
        async function handleAddToCart(productId) {
            if (!currentUser) {
                showToast('Please login', 'Login to add items to cart.', 'warning');
                openAuthModal();
                return;
            }
            const product = allProducts.find(p => p.id === productId);
            if (!product) return;

            const cartRef = ref(db, `users/${currentUser.uid}/cart/${productId}`);
            const snap = await get(cartRef);
            const currentQty = snap.exists() ? snap.val().quantity : 0;
            await set(cartRef, { quantity: currentQty + 1 });
            showToast('Added!', `${product.name} added to cart.`, 'success');
            // The listener will update cartData automatically
        }

        async function updateCartQty(productId, change) {
            if (!currentUser) return;
            const cartRef = ref(db, `users/${currentUser.uid}/cart/${productId}`);
            const snap = await get(cartRef);
            if (!snap.exists()) return;
            const newQty = snap.val().quantity + change;
            if (newQty <= 0) {
                await remove(cartRef);
            } else {
                await set(cartRef, { quantity: newQty });
            }
            // Listener will update
        }

        async function removeFromCart(productId) {
            if (!currentUser) return;
            await remove(ref(db, `users/${currentUser.uid}/cart/${productId}`));
            // Listener will update
        }

        async function handleToggleWishlist(productId) {
            if (!currentUser) {
                showToast('Please login', 'Login to manage wishlist.', 'warning');
                openAuthModal();
                return;
            }
            const wRef = ref(db, `users/${currentUser.uid}/wishlist/${productId}`);
            const snap = await get(wRef);
            if (snap.exists()) {
                await remove(wRef);
                showToast('Removed', 'Removed from wishlist.', 'info');
            } else {
                await set(wRef, true);
                showToast('Saved!', 'Added to wishlist.', 'success');
            }
            // Listener will update
        }

        // ---- Checkout ----
        function openCheckout() {
            if (!currentUser) {
                showToast('Please login', 'Login to place order.', 'warning');
                openAuthModal();
                return;
            }
            const items = Object.entries(cartData);
            if (items.length === 0) {
                showToast('Cart empty', 'Add items before checkout.', 'warning');
                return;
            }

            openModal(`
                <h2>📦 Checkout</h2>
                <p class="sub">Enter your shipping details</p>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-wrap"><i class="fas fa-user"></i><input type="text" id="shipName" placeholder="Your full name" required /></div>
                    </div>
                    <div class="form-group">
                        <label>Mobile Number</label>
                        <div class="input-wrap"><i class="fas fa-phone"></i><input type="tel" id="shipPhone" placeholder="9876543210" pattern="[0-9]{10}" required /></div>
                    </div>
                    <div class="form-group">
                        <label>Shipping Address</label>
                        <div class="input-wrap"><i class="fas fa-map-marker-alt"></i><textarea id="shipAddress" placeholder="Full address" rows="3" required></textarea></div>
                    </div>
                    <button type="submit" class="btn-primary">Place Order</button>
                </form>
            `);

            document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('shipName').value.trim();
                const phone = document.getElementById('shipPhone').value.trim();
                const address = document.getElementById('shipAddress').value.trim();

                if (!name || !phone || !address) {
                    showToast('Error', 'All fields are required.', 'error');
                    return;
                }
                if (!/^[0-9]{10}$/.test(phone)) {
                    showToast('Error', 'Enter a valid 10-digit mobile number.', 'error');
                    return;
                }

                const orderItems = Object.entries(cartData).map(([id, item]) => {
                    const p = allProducts.find(x => x.id === id);
                    return { productId: id, name: p?.name || 'Pet', quantity: item.quantity, price: p?.price || 0 };
                });
                const total = orderItems.reduce((s, i) => s + i.price * i.quantity, 0);

                try {
                    const orderRef = push(ref(db, `orders/${currentUser.uid}`));
                    await set(orderRef, {
                        orderId: orderRef.key,
                        date: Date.now(),
                        userEmail: currentUser.email,
                        items: orderItems,
                        totalAmount: total,
                        status: 'pending',
                        shippingName: name,
                        shippingMobile: phone,
                        shippingAddress: address
                    });
                    await remove(ref(db, `users/${currentUser.uid}/cart`));
                    closeModal();
                    showToast('Order placed!', 'Your order has been placed successfully.', 'success');
                    // Listener will update cart and orders
                    navigateTo('orders');
                } catch (err) {
                    showToast('Error', 'Failed to place order.', 'error');
                }
            });
        }

        // ---- Auth ----
        let authMode = 'login';

        function openAuthModal() {
            openModal(`
                <h2>🔐 ${authMode === 'login' ? 'Login' : 'Register'}</h2>
                <p class="sub">${authMode === 'login' ? 'Access your account' : 'Create a new account'}</p>
                <form id="authForm">
                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-wrap"><i class="fas fa-envelope"></i><input type="email" id="authEmail" placeholder="email@example.com" required /></div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrap"><i class="fas fa-lock"></i><input type="password" id="authPassword" placeholder="••••••••" required /></div>
                    </div>
                    ${authMode === 'register' ? `
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <div class="input-wrap"><i class="fas fa-lock"></i><input type="password" id="authConfirm" placeholder="••••••••" required /></div>
                        </div>
                    ` : ''}
                    <button type="submit" class="btn-primary" id="authSubmit">${authMode === 'login' ? 'Login' : 'Create Account'}</button>
                    <div class="auth-msg" id="authMsg"></div>
                </form>
                <div class="auth-toggle">
                    ${authMode === 'login' ? "Don't have an account? " : "Already have an account? "}
                    <a id="authToggleLink">${authMode === 'login' ? 'Register' : 'Login'}</a>
                </div>
            `);

            let mode = authMode;
            document.getElementById('authToggleLink').addEventListener('click', () => {
                mode = mode === 'login' ? 'register' : 'login';
                closeModal();
                authMode = mode;
                openAuthModal();
            });

            document.getElementById('authForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('authEmail').value.trim();
                const password = document.getElementById('authPassword').value;
                const msg = document.getElementById('authMsg');
                msg.className = 'auth-msg';
                msg.textContent = '';
                const submitBtn = document.getElementById('authSubmit');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Processing...';

                try {
                    if (mode === 'login') {
                        await signInWithEmailAndPassword(auth, email, password);
                        showToast('Welcome!', 'Login successful.', 'success');
                        closeModal();
                    } else {
                        const confirm = document.getElementById('authConfirm').value;
                        if (password !== confirm) { msg.className = 'auth-msg error';
                            msg.textContent = 'Passwords do not match.';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Create Account'; return; }
                        if (password.length < 6) { msg.className = 'auth-msg error';
                            msg.textContent = 'Password must be at least 6 characters.';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Create Account'; return; }
                        const cred = await createUserWithEmailAndPassword(auth, email, password);
                        await set(ref(db, `users/${cred.user.uid}`), { email, joinedDate: Date.now(), lastLogin: Date.now() });
                        showToast('Welcome!', 'Account created successfully.', 'success');
                        closeModal();
                    }
                } catch (err) {
                    msg.className = 'auth-msg error';
                    msg.textContent = err.message || 'Authentication failed.';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = mode === 'login' ? 'Login' : 'Create Account';
                }
            });
        }
        async function handleLogout() {
            await signOut(auth);
            showToast('Logged out', 'See you soon!', 'info');
            navigateTo('home');
        }

        // ---- Firebase listeners ----
        function setupListeners() {
            // Products
            onValue(ref(db, 'pets'), (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    allProducts = Object.entries(data).filter(([_, p]) => p.status === 'approved').map(([id, p]) => ({ id,
                        ...p }));
                } else {
                    allProducts = [];
                }
                renderCategories(allProducts);
                renderProducts(allProducts);
                if (currentUser) {
                    renderCart();
                    renderWishlist();
                }
            });

            // Auth
            onAuthStateChanged(auth, async (user) => {
                currentUser = user;
                const indicator = document.getElementById('authIndicator');
                if (user) {
                    indicator.classList.add('active');
                    userCartRef = ref(db, `users/${user.uid}/cart`);
                    userWishlistRef = ref(db, `users/${user.uid}/wishlist`);
                    // Attach listeners for cart and wishlist
                    onValue(userCartRef, (snap) => {
                        cartData = snap.val() || {};
                        renderCart();
                        updateCartBadge();
                    });
                    onValue(userWishlistRef, (snap) => {
                        wishlistData = snap.val() || {};
                        renderWishlist();
                        updateWishlistBadge();
                        // update product wishlist icons
                        document.querySelectorAll('.wishlist-btn').forEach(btn => {
                            btn.classList.toggle('active', !!wishlistData[btn.dataset.id]);
                        });
                    });
                    // Load orders
                    onValue(ref(db, `orders/${user.uid}`), (snap) => {
                        if (snap.exists()) {
                            const data = snap.val();
                            ordersData = Object.entries(data).map(([id, o]) => ({ id, ...o }));
                            ordersData.sort((a, b) => (b.date || 0) - (a.date || 0));
                        } else {
                            ordersData = [];
                        }
                        renderOrders();
                    });
                    renderProfile();
                } else {
                    indicator.classList.remove('active');
                    cartData = {};
                    wishlistData = {};
                    ordersData = [];
                    renderCart();
                    renderWishlist();
                    renderOrders();
                    // Remove listeners? Not necessary as onAuthStateChanged will trigger new ones.
                }
            });
        }

        function updateCartBadge() {
            const total = Object.values(cartData).reduce((s, v) => s + v.quantity, 0);
            const badge = document.getElementById('cartBadge');
            badge.textContent = total;
            badge.classList.toggle('active', total > 0);
        }

        function updateWishlistBadge() {
            const count = Object.keys(wishlistData).length;
            const badge = document.getElementById('wishlistBadge');
            badge.textContent = count;
            badge.classList.toggle('active', count > 0);
        }

        // ---- Slider images ----
        async function loadSlider() {
            try {
                const snap = await get(ref(db, 'sliderImages'));
                if (snap.exists()) renderSlider(Object.values(snap.val()));
                else renderSlider([]);
            } catch (_) { renderSlider([]); }
        }

        // ---- Init ----
        async function init() {
            await loadSlider();
            setupListeners();
            setTimeout(() => loader.classList.add('hide'), 600);
            setTheme(theme);
        }

        // Expose for inline
        window.navigateTo = navigateTo;
        window.openAuthModal = openAuthModal;

        init();
        console.log('🐠 ABI Pets Marketplace loaded!');
    </script>
</body>
</html>
